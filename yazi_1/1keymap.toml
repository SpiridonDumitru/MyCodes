#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]

prepend_keymap = [

    # ─────────────────────────────────────
    # Better navigation
    # ─────────────────────────────────────

    { on = "h", run = "leave", desc = "Go to parent directory" },
    { on = "l", run = "enter", desc = "Enter directory" },

    { on = "H", run = "back", desc = "Back" },
    { on = "L", run = "forward", desc = "Forward" },

    { on = [ "g", "p" ], run = "cd ~/Projects", desc = "Go to Projects" },
    { on = [ "g", "D" ], run = "cd ~/Documents", desc = "Go to Documents" },

    # ─────────────────────────────────────
    # Hidden files
    # ─────────────────────────────────────

    { on = ".", run = "hidden toggle", desc = "Toggle hidden files" },


    # ─────────────────────────────────────
    # Search
    # ─────────────────────────────────────

    { on = "/", run = "find --smart", desc = "Find files" },


    # ─────────────────────────────────────
    # Quick shell
    # ─────────────────────────────────────

    { on = "!", run = 'shell "$SHELL" --block', desc = "Open shell here" },


    # ─────────────────────────────────────
    # Preview
    # ─────────────────────────────────────

    { on = "<C-j>", run = "seek 5", desc = "Scroll preview down" },
    { on = "<C-k>", run = "seek -5", desc = "Scroll preview up" },


    # ─────────────────────────────────────
    # Selection
    # ─────────────────────────────────────

    { on = "<Space>", run = "toggle", desc = "Toggle selection" },


    # ─────────────────────────────────────
    # Yank / paste
    # ─────────────────────────────────────

    { on = "y", run = "yank", desc = "Yank selected files" },
    { on = "x", run = "yank --cut", desc = "Cut selected files" },
    { on = "p", run = "paste", desc = "Paste files" },


    # ─────────────────────────────────────
    # Delete
    # ─────────────────────────────────────

    { on = "d", run = "remove", desc = "Trash selected files" },


    # ─────────────────────────────────────
    # Rename
    # ─────────────────────────────────────

    { on = "r", run = "rename", desc = "Rename selected file" },


    # ─────────────────────────────────────
    # Create
    # ─────────────────────────────────────

    { on = "a", run = "create", desc = "Create file or directory" },


    # ─────────────────────────────────────
    # Open
    # ─────────────────────────────────────

    { on = "o", run = "open", desc = "Open selected file" },


    # ─────────────────────────────────────
    # Tabs
    # ─────────────────────────────────────

    { on = "t", run = "tab_create --current", desc = "Create tab" },

    { on = "<A-1>", run = "tab_switch 0", desc = "Tab 1" },
    { on = "<A-2>", run = "tab_switch 1", desc = "Tab 2" },
    { on = "<A-3>", run = "tab_switch 2", desc = "Tab 3" },


    # ─────────────────────────────────────
    # Quit
    # ─────────────────────────────────────

    { on = "q", run = "quit", desc = "Quit" },


    # ─────────────────────────────────────
    # Vim-style count-prefixed motions (3k, 6j, 3gg, 3G, etc.)
    # Pure keymap sequences -- no plugin, nothing that can hang.
    # ─────────────────────────────────────

    { on = [ "1", "j" ], run = "arrow 1", desc = "Move down 1" },
    { on = [ "2", "j" ], run = "arrow 2", desc = "Move down 2" },
    { on = [ "3", "j" ], run = "arrow 3", desc = "Move down 3" },
    { on = [ "4", "j" ], run = "arrow 4", desc = "Move down 4" },
    { on = [ "5", "j" ], run = "arrow 5", desc = "Move down 5" },
    { on = [ "6", "j" ], run = "arrow 6", desc = "Move down 6" },
    { on = [ "7", "j" ], run = "arrow 7", desc = "Move down 7" },
    { on = [ "8", "j" ], run = "arrow 8", desc = "Move down 8" },
    { on = [ "9", "j" ], run = "arrow 9", desc = "Move down 9" },
    { on = [ "1", "k" ], run = "arrow -1", desc = "Move up 1" },
    { on = [ "2", "k" ], run = "arrow -2", desc = "Move up 2" },
    { on = [ "3", "k" ], run = "arrow -3", desc = "Move up 3" },
    { on = [ "4", "k" ], run = "arrow -4", desc = "Move up 4" },
    { on = [ "5", "k" ], run = "arrow -5", desc = "Move up 5" },
    { on = [ "6", "k" ], run = "arrow -6", desc = "Move up 6" },
    { on = [ "7", "k" ], run = "arrow -7", desc = "Move up 7" },
    { on = [ "8", "k" ], run = "arrow -8", desc = "Move up 8" },
    { on = [ "9", "k" ], run = "arrow -9", desc = "Move up 9" },

    { on = [ "1", "g", "g" ], run = "arrow top", desc = "Go to line 1" },
    { on = [ "2", "g", "g" ], run = [ "arrow top", "arrow 1" ], desc = "Go to line 2" },
    { on = [ "3", "g", "g" ], run = [ "arrow top", "arrow 2" ], desc = "Go to line 3" },
    { on = [ "4", "g", "g" ], run = [ "arrow top", "arrow 3" ], desc = "Go to line 4" },
    { on = [ "5", "g", "g" ], run = [ "arrow top", "arrow 4" ], desc = "Go to line 5" },
    { on = [ "6", "g", "g" ], run = [ "arrow top", "arrow 5" ], desc = "Go to line 6" },
    { on = [ "7", "g", "g" ], run = [ "arrow top", "arrow 6" ], desc = "Go to line 7" },
    { on = [ "8", "g", "g" ], run = [ "arrow top", "arrow 7" ], desc = "Go to line 8" },
    { on = [ "9", "g", "g" ], run = [ "arrow top", "arrow 8" ], desc = "Go to line 9" },
    { on = [ "1", "G" ], run = "arrow top", desc = "Go to line 1" },
    { on = [ "2", "G" ], run = [ "arrow top", "arrow 1" ], desc = "Go to line 2" },
    { on = [ "3", "G" ], run = [ "arrow top", "arrow 2" ], desc = "Go to line 3" },
    { on = [ "4", "G" ], run = [ "arrow top", "arrow 3" ], desc = "Go to line 4" },
    { on = [ "5", "G" ], run = [ "arrow top", "arrow 4" ], desc = "Go to line 5" },
    { on = [ "6", "G" ], run = [ "arrow top", "arrow 5" ], desc = "Go to line 6" },
    { on = [ "7", "G" ], run = [ "arrow top", "arrow 6" ], desc = "Go to line 7" },
    { on = [ "8", "G" ], run = [ "arrow top", "arrow 7" ], desc = "Go to line 8" },
    { on = [ "9", "G" ], run = [ "arrow top", "arrow 8" ], desc = "Go to line 9" },
]
