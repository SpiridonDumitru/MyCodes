#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 3, 5]

show_hidden = false
show_symlink = true
show_motion = true

sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true

linemode = "size"

scrolloff = 5

[preview]
wrap = "yes"
tab_size = 4

max_width = 1000
max_height = 1000

image_delay = 30

[opener]
edit = [
	{ run = 'nvim %s', desc = "Open in nvim", block = true, for = "unix" },
]

[open]
# Prepend so these take priority over the built-in rules, without
# clobbering yazi's existing handling of images/video/archives/etc.
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{json,x-yaml,toml,xml,javascript}", use = "edit" },
	{ url = "*.{conf,cfg,ini,env,log,md,lua,py,rs,go,c,h,cpp,sh,zsh}", use = "edit" },
	{ url = "*/.{gitignore,bashrc,zshrc,vimrc}", use = "edit" },
]
